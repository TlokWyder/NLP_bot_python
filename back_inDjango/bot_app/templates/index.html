<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP FAQ Bot</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #ddd; }
        #chat { height: 400px; overflow-y: auto; padding: 20px; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #007bff; color: white; }
        .bot-msg { align-self: flex-start; background: #e9e9eb; color: #333; white-space: pre-line; }
        .input-area { display: flex; padding: 10px; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="chat">
            <div class="msg bot-msg">Привет! Я твой FAQ-бот. Спроси меня что-нибудь или напиши "команды".</div>
        </div>
        <div class="input-area">
            <input type="text" id="msg" placeholder="Введите ваш вопрос..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Отправить</button>
        </div>
    </div>

    <script>
        async function send() {
            let input = document.getElementById('msg');
            let chat = document.getElementById('chat');
            let text = input.value.trim();

            if (!text) return;

            // Добавляем сообщение пользователя на экран
            chat.innerHTML += `<div class="msg user-msg">${text}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                let res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                let data = await res.json();

                // Добавляем ответ бота
                chat.innerHTML += `<div class="msg bot-msg">${data.response}</div>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (e) {
                chat.innerHTML += `<div class="msg bot-msg">⚠️ Ошибка связи с сервером.</div>`;
            }
        }
    </script>
</body>
</html>
