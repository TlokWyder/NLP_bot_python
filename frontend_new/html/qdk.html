<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>FAQ Bot</title></head>
<body>
    <div id="chat" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px;"></div>
    <input type="text" id="msg"><button onclick="send()">Отправить</button>
    <script>
        async function send() {
            let input = document.getElementById('msg');
            let chat = document.getElementById('chat');
            let res = await fetch('http://127.0.0.1:8000/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input.value})
            });
            let data = await res.json();
            chat.innerHTML += `<div><b>Вы:</b> ${input.value}</div><div><b>Бот:</b> ${data.response}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
